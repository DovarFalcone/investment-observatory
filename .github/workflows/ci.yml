name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: observatory
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U observatory -d observatory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://observatory:observatory@localhost:5432/observatory

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker build -t investment-observatory:ci .
